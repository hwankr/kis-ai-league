# config.local.toml에 복사해 모의투자 키를 입력합니다.
default_account = 'paper'

[market_data]
symbols = ['005930']
interval_seconds = 60  # 한 회차를 마친 뒤 다음 조회까지 대기하는 초 (10~3600)
# account = 'paper'  # 생략하면 default_account의 키 사용

[accounts.paper]
name = '일반 모의투자'
app_key = ''
app_secret = ''
account = ''  # 모의 계좌 앞 8자리. 잔고 조회 시 필요합니다.
product_code = '01'  # 계좌 뒤 2자리

# 대회 계좌 발급 후 아래 블록을 추가합니다. 모의 서버만 사용합니다.
# [accounts.competition]
# name = 'AI 리그 대회'
# app_key = ''
# app_secret = ''
# account = ''
# product_code = '01'

[experiments]
autonomous = false  # true: 기본 모의계좌 자동 배분·주문·재시작 복구. 사용자 중지는 유지.

[experiments.learning]
# 생략하면 experiments.autonomous를 따름. 전체 전략 운용에서 새 관측으로 평가·자동 교체.
# enabled = true
max_drawdown_pct = 15  # AI 자산 손실 보호 초기값. 연구기가 변경하지 않음.

[experiments.llm]
provider = 'codex'  # 설치된 Codex CLI와 기존 ChatGPT 로그인 사용
enabled = true
timeout_seconds = 180
# model = '...'  # 생략하면 기존 Codex 모델 설정 사용
